# Production stack — full VPS or split (managed Postgres + VPS frontend/API).
#
# Full stack on one VPS (app + API + Postgres + scheduler):
#   cp .env.production.example .env
#   ./scripts/prod-up.sh --all
#
# API + frontend on VPS, managed Postgres elsewhere:
#   ./scripts/prod-up.sh
#
# Requires: APP_DOMAIN, API_DOMAIN, ACME_EMAIL in .env

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env e.g. app.yourdomain.com}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env e.g. api.yourdomain.com}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env for Let's Encrypt}
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL e.g. https://api.yourdomain.com/api/v1}
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DEBUG: "false"
    entrypoint: ["python", "scripts/apply_migrations.py"]
    depends_on:
      db:
        condition: service_healthy
        required: false
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to https://APP_DOMAIN}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL to https://APP_DOMAIN}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL to https://API_DOMAIN}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      STORAGE_LOCAL_PATH: /app/storage
    volumes:
      - app_storage:/app/storage
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    command: app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-2}
    entrypoint: ["uvicorn"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
        required: false

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_API_URL: http://api:8000
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      REMINDER_CRON_INTERVAL_SECONDS: ${REMINDER_CRON_INTERVAL_SECONDS:-3600}
    command: scripts/run_reminders.py
    entrypoint: ["python"]
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - scheduler

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiemployee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD when using --all}
      POSTGRES_DB: ${POSTGRES_DB:-aiemployee}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aiemployee} -d ${POSTGRES_DB:-aiemployee}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - bundled-db

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  app_storage:
